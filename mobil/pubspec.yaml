name: drone_voice_control
description: Sesli komutla drone kontrol mobil uygulaması - Gazebo Sim & ROS 2 uyumlu
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.5
  web_socket_channel: ^3.0.1
  equatable: ^2.0.7
  get_it: ^8.0.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.4
  audioplayers: ^6.1.0
  json_annotation: ^4.9.0
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.4.2
  wakelock_plus: ^1.8.1
  record: ^7.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
